<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 300px;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }


    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">b</td>
            
           
           
        </tr>

        <tr>
            <td rowspan="4">c</td>
            <td>d</td>
            <td>e</td>
            <td>f</td>


        </tr>
        
        <tr>
            <td>g</td>
            <td>h</td>
            <td>i</td>


        </tr>

        
        <td>j</td>
        <td>l</td>
        <td>m</td>

        <tr>
            <td colspan="6">n</td>
        </tr>


    </table>
</body>
</html>
