<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'pietro' ;
            src: url('Fonts/Matcha\ Mint.otf') format('opentype'), url('Fonts/Matcha\ Mint.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;

            /*tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg*/
        }
        body{

            font-family: Arial, Helvetica, sans-serif;
        }
        h1{

            font-family: 'pietro', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Obrigado Deus por tudo, estou cada dia mais aprendendo mais com vc que isso me faça melhor cada vez mais amem</p>
</body>
</html>
